version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webbank
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/webbank
      # add other required env variables here
      # SESSION_SECRET: supersecret
    ports:
      - "5000:5000"
    depends_on:
      - db
    # optional volume for development
    # volumes:
    #   - .:/usr/src/app
    #   - /usr/src/app/node_modules
    # command: npm run dev

volumes:
  db-data:
